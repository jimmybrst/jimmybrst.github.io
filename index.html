<title>专属弹唱小谱本 🍒</title>
<style>
:root {
  --bg: #FBF6F0;
  --bg-elev: #FFFDFB;
  --bg-pill: #F4EAE0;
  --text: #2C221E;
  --text-sub: #7A6860;
  --text-muted: #B09E95;
  --accent: #E85D75;
  --accent-soft: rgba(232, 93, 117, 0.14);
  --accent-glow: rgba(232, 93, 117, 0.28);
  --green: #3B9B6E;
  --green-soft: rgba(59, 155, 110, 0.14);
  --border: #EADFD4;
  --card-shadow: 0 4px 14px rgba(90, 60, 45, 0.06);
  --active-line-bg: #FFF5F7;
  --active-line-border: #F5B5C2;
  --font-scale: 1;
}
[data-theme="dark"] {
  --bg: #141416;
  --bg-elev: #1E1E22;
  --bg-pill: #2A2A30;
  --text: #F3EFEA;
  --text-sub: #A09A96;
  --text-muted: #66615E;
  --accent: #FF7A90;
  --accent-soft: rgba(255, 122, 144, 0.18);
  --accent-glow: rgba(255, 122, 144, 0.35);
  --green: #52C48A;
  --green-soft: rgba(82, 196, 138, 0.18);
  --border: #2C2C32;
  --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
  --active-line-bg: #261B20;
  --active-line-border: #FF7A90;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; padding: 0;
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif;
  max-width: 430px; margin-left: auto; margin-right: auto;
  min-height: 100vh; position: relative;
  padding-bottom: 92px;
  transition: background 0.25s, color 0.25s;
}
.pixel-svg { width: 100%; height: 100%; display: block; image-rendering: pixelated; }

/* Header */
.top-header {
  position: sticky; top: 0; z-index: 30;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 10px 14px;
  display: flex; align-items: center; justify-content: space-between;
}
.brand-row { display: flex; align-items: center; gap: 10px; }
.avatar-box {
  width: 44px; height: 44px; border-radius: 12px; overflow: hidden;
  border: 2px solid var(--accent); flex-shrink: 0;
  box-shadow: 0 2px 8px var(--accent-soft);
}
.brand-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 5px; }
.brand-sub { font-size: 11px; color: var(--text-sub); margin-top: 2px; }
.header-actions { display: flex; align-items: center; gap: 6px; }
.icon-btn {
  background: var(--bg-pill); color: var(--text);
  border: 1px solid var(--border); border-radius: 10px;
  padding: 6px 10px; font-size: 12px; font-weight: 600; cursor: pointer;
}

/* Views */
.view { display: none; padding: 12px 14px; }
.view.active { display: block; }
.search-row { display: flex; gap: 6px; margin-bottom: 10px; }
.search-input {
  flex: 1; background: var(--bg-elev); color: var(--text);
  border: 1.5px solid var(--border); border-radius: 12px;
  padding: 9px 11px; font-size: 13.5px; outline: none;
}
.search-input:focus { border-color: var(--accent); }
.btn-primary {
  background: var(--accent); color: #fff; border: none;
  border-radius: 12px; padding: 9px 12px; font-size: 13px; font-weight: 700;
  cursor: pointer; white-space: nowrap;
}
.btn-secondary {
  background: var(--bg-pill); color: var(--text); border: 1px solid var(--border);
  border-radius: 12px; padding: 9px 11px; font-size: 12.5px; font-weight: 700;
  cursor: pointer; white-space: nowrap;
}
.filter-pills { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 8px; }
.pill {
  background: var(--bg-pill); color: var(--text-sub);
  border: 1px solid transparent; border-radius: 999px;
  padding: 5px 12px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.pill.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

.sec-label {
  font-size: 12px; font-weight: 800; color: var(--text-sub);
  margin: 10px 2px 8px; display: flex; align-items: center; justify-content: space-between;
}

.song-card {
  background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: 16px; padding: 12px 14px; margin-bottom: 10px;
  box-shadow: var(--card-shadow); cursor: pointer;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.song-card-left { flex: 1; min-width: 0; }
.song-title { font-size: 16.5px; font-weight: 700; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.song-artist { font-size: 12.5px; color: var(--text-sub); font-weight: 500; }
.song-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.badge {
  font-size: 11px; padding: 2px 7px; border-radius: 6px;
  background: var(--bg-pill); color: var(--text-sub); font-weight: 600;
}
.badge.pink { background: var(--accent-soft); color: var(--accent); }
.badge.green { background: var(--green-soft); color: var(--green); }
.song-preview { font-size: 12px; color: var(--text-muted); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.add-lib-btn {
  background: var(--accent); color: #fff; border: none;
  border-radius: 10px; padding: 7px 11px; font-size: 12px; font-weight: 700;
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
}
.add-lib-btn.added {
  background: var(--green-soft); color: var(--green); border: 1px solid var(--green);
}

/* Toast */
.toast {
  position: fixed; top: 68px; left: 50%; transform: translateX(-50%);
  background: #2C221E; color: #fff; padding: 8px 16px; border-radius: 999px;
  font-size: 13px; font-weight: 700; z-index: 100; display: none;
  box-shadow: 0 4px 14px rgba(0,0,0,0.25); white-space: nowrap;
}

/* Song Detail View */
.song-nav {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.back-btn {
  background: var(--bg-pill); color: var(--text); border: none;
  border-radius: 10px; padding: 6px 11px; font-size: 13px; font-weight: 700; cursor: pointer;
}
.song-head-center { text-align: center; }
.song-head-title { font-size: 18px; font-weight: 800; }
.song-head-artist { font-size: 12px; color: var(--text-sub); }

/* Yoopu-style Control Row */
.control-strip {
  background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: 14px; padding: 9px 8px; margin-bottom: 8px;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; text-align: center;
}
.ctrl-item { cursor: pointer; padding: 2px; border-radius: 8px; }
.ctrl-val { font-size: 14.5px; font-weight: 800; color: var(--text); }
.ctrl-val span { color: var(--accent); font-size: 12px; }
.ctrl-lbl { font-size: 10.5px; color: var(--text-sub); margin-top: 2px; }

/* Beat Indicator Bar */
.beat-bar {
  background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: 14px; padding: 7px 12px; margin-bottom: 10px;
  display: flex; align-items: center; justify-content: space-between;
}
.bear-mascot { width: 28px; height: 28px; transition: transform 0.15s; flex-shrink: 0; }
.bear-mascot.nod { transform: translateY(-3px) scale(1.08); }
.beat-dots { display: flex; align-items: center; gap: 10px; }
.beat-dot {
  width: 11px; height: 11px; border-radius: 50%;
  background: var(--bg-pill); border: 1.5px solid var(--border);
  transition: all 0.1s;
}
.beat-dot.on { background: var(--accent); border-color: var(--accent); transform: scale(1.25); box-shadow: 0 0 8px var(--accent); }
.beat-status { font-size: 12px; font-weight: 700; color: var(--accent); min-width: 78px; text-align: right; }

/* Chord Chips Bar */
.chord-strip {
  display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px;
}
.chord-chip {
  background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: 9px; padding: 4px 10px; font-size: 13px; font-weight: 700;
  color: var(--accent); cursor: pointer; white-space: nowrap;
}

/* Sheet Lines (Optimized for 375px iPhone without line wrap) */
.sheet-container { display: flex; flex-direction: column; gap: 6px; }
.section-header {
  font-size: 12px; font-weight: 700; color: var(--text-sub);
  background: var(--bg-pill); padding: 4px 10px; border-radius: 8px;
  margin-top: 6px; display: inline-block; align-self: flex-start;
}
.lyric-line {
  position: relative; overflow: hidden;
  background: var(--bg-elev); border: 1.5px solid transparent;
  border-radius: 12px; padding: 8px 10px 7px;
  cursor: pointer; transition: all 0.2s;
}
.lyric-line.active {
  background: var(--active-line-bg);
  border-color: var(--active-line-border);
  box-shadow: 0 3px 12px var(--accent-soft);
}
.line-progress {
  position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
  background: var(--accent-soft); pointer-events: none;
  transition: width 0.08s linear;
}
.segments-row {
  position: relative; z-index: 2;
  display: flex; flex-wrap: nowrap; align-items: flex-end;
  justify-content: flex-start;
}
.seg {
  display: inline-flex; flex-direction: column; align-items: flex-start;
  margin-right: 0.5px;
}
.ch {
  font-size: calc(13.5px * var(--font-scale));
  font-weight: 800; color: var(--accent);
  line-height: 1.15; min-height: 16px;
  padding: 0 2px; border-radius: 4px;
  transition: transform 0.12s, background 0.12s;
}
.ch.pulse {
  background: var(--accent); color: #fff;
  transform: translateY(-2px) scale(1.08);
}
.tx {
  font-size: calc(18px * var(--font-scale));
  font-weight: 600; line-height: 1.35;
  letter-spacing: 0.1px; white-space: nowrap;
}
.tx u {
  text-decoration: none;
  border-bottom: 2px solid var(--accent);
  padding-bottom: 1px;
}

/* Bottom Section Jump & Floating Follow Bar */
.bottom-bar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 430px; z-index: 40;
  background: var(--bg-elev); border-top: 1px solid var(--border);
  padding: 6px 12px calc(10px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -4px 16px rgba(0,0,0,0.08);
}
.sec-tabs {
  display: flex; gap: 4px; overflow-x: auto; margin-bottom: 7px;
}
.sec-tab {
  flex: 1; text-align: center; background: var(--bg-pill);
  color: var(--text-sub); font-size: 11px; font-weight: 700;
  padding: 4px 6px; border-radius: 6px; cursor: pointer; white-space: nowrap;
}
.sec-tab.active { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); }
.play-controls {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.play-btn {
  flex: 1; background: var(--accent); color: #fff; border: none;
  border-radius: 999px; padding: 10px 14px; font-size: 14px; font-weight: 800;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
  box-shadow: 0 3px 10px var(--accent-glow);
}
.sub-btn {
  background: var(--bg-pill); color: var(--text); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 10px; font-size: 12px; font-weight: 700; cursor: pointer;
}
.sub-btn.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

/* Modals */
.modal-mask {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  z-index: 60; display: none; align-items: flex-end; justify-content: center;
}
.modal-mask.open { display: flex; }
.modal-sheet {
  width: 100%; max-width: 430px; background: var(--bg-elev);
  border-radius: 20px 20px 0 0; padding: 16px;
  max-height: 86vh; overflow-y: auto;
}
.modal-title { font-size: 16px; font-weight: 800; margin-bottom: 12px; display: flex; justify-content: space-between; }
.form-row { margin-bottom: 10px; }
.form-lbl { font-size: 12px; font-weight: 700; color: var(--text-sub); margin-bottom: 4px; display: block; }
.form-inp, .form-area {
  width: 100%; background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; font-size: 13px;
}
.form-area { min-height: 115px; font-family: monospace; line-height: 1.45; }
.chord-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.chord-card {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 12px; padding: 10px; text-align: center; cursor: pointer;
}
</style>
</head>

<!-- VIEW 1: SONG LIBRARY & ONE-CLICK SEARCH-TO-ADD -->
<main id="libraryView" class="view active">
  <div class="search-row">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 输入歌名(如：程艾影、成都、虚拟)搜谱..." oninput="renderLibrary()">
    <button class="btn-primary" onclick="triggerSearchFocus()">搜索曲库</button>
    <button class="btn-secondary" onclick="openAddModal()">＋贴谱</button>
  </div>
  <div class="filter-pills" id="filterPills">
    <span class="pill active" onclick="setFilter('all')">全部</span>
    <span class="pill" onclick="setFilter('赵雷')">赵雷</span>
    <span class="pill" onclick="setFilter('陈粒')">陈粒</span>
    <span class="pill" onclick="openChordModal()">🎸 和弦指法试听</span>
  </div>

  <!-- Search Results from Cloud/Built-in Catalog to Add to Library -->
  <div id="catalogResultsSection" style="display:none;">
    <div class="sec-label">
      <span>✨ 搜到的可添加曲谱（点右侧按钮直接加入曲库）</span>
      <span style="color:var(--accent);cursor:pointer;" onclick="clearSearch()">清空搜索</span>
    </div>
    <div id="catalogList"></div>
  </div>

  <div class="sec-label">
    <span id="myLibHeader">🍒 我的手机曲库</span>
    <span style="font-weight:600;font-size:11px;" id="myLibCount"></span>
  </div>
  <div id="songList"></div>
</main>

<!-- VIEW 2: SONG SHEET & FOLLOW ALONG -->
<main id="sheetView" class="view">
  <div class="song-nav">
    <button class="back-btn" onclick="backToLibrary()">‹ 曲库</button>
    <div class="song-head-center">
      <div class="song-head-title" id="stTitle">程艾影</div>
      <div class="song-head-artist" id="stArtist">赵雷 · 4/4拍</div>
    </div>
    <button class="back-btn" onclick="openChordModal()">🎸 指法</button>
  </div>

  <div class="control-strip">
    <div class="ctrl-item" onclick="transposeKey()">
      <div class="ctrl-val" id="ctrlKey">G调 <span>›</span></div>
      <div class="ctrl-lbl" id="ctrlCapo">不夹 (点此变调)</div>

// Initial user library starts with 3 core songs
const INITIAL_LIB_IDS = ["cheng-ai-ying-g", "jue-dui-zhan-you", "qi-miao-neng-li-ge"];
let songs = JSON.parse(localStorage.getItem("custom_songbook_v2") || "null") ||
            BUILTIN_CATALOG.filter(s => INITIAL_LIB_IDS.includes(s.id));

let currentFilter = "all";
let currentSong = songs[0];
let semitoneShift = 0;
let isPlaying = false;
let metroOn = true;
let loopSection = false;
let currentLineIdx = 0;
let lineBeatProgress = 0;
let beatInBar = 0;
let barCount = 1;
let timerId = null;
let audioCtx = null;

const FONT_SCALES = [0.92, 1.0, 1.12];

function showToast(msg) {
  const t = document.getElementById("toastBox");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { t.style.display = "none"; }, 2200);
}

function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
}

function playClick(isStrong) {
  if (!metroOn) return;
  try {
    ensureAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = isStrong ? 880 : 587.33;
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.065);
  } catch(e){}
}

function strumChord(chordName) {
  try {
    ensureAudio();
    const base = chordName.replace(/[^A-G#m7maj]/g, "");
    const freqs = CHORD_FREQS[base] || CHORD_FREQS["G"];
    freqs.forEach((f, i) => {
      setTimeout(() => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.value = f;
        gain.gain.setValueAtTime(0.14, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.1);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 1.15);
      }, i * 38);
    });
  } catch(e){}
}

function shiftChordName(chord, shift) {
  if (!shift) return chord;
  return chord.replace(/^[A-G]#?/, (root) => {
    const idx = NOTES.indexOf(root);
    if (idx === -1) return root;
    return NOTES[(idx + shift + 120) % 12];
  });
}

// Convert 2-line chord-over-lyric sheets into [Chord]lyric format automatically
function normalizeSheetInput(raw) {
  const lines = raw.split(/\r?\n/);
  const out = [];
  const chordLineRe = /^\s*([A-G][#b]?(?:m|maj|min|sus|dim|aug|add)?\d*(?:\/[A-G][#b]?)?\s*)+$/;
  for (let i = 0; i < lines.length; i++) {
    const cur = lines[i];
    if (chordLineRe.test(cur) && i + 1 < lines.length && !lines[i+1].trim().startsWith("#") && !chordLineRe.test(lines[i+1])) {
      const lyric = lines[i+1].trim();
      const chords = cur.trim().split(/\s+/);
      let merged = "";
      const step = Math.max(1, Math.floor(lyric.length / chords.length));
      for (let c = 0; c < chords.length; c++) {
        const pos = Math.min(lyric.length, c * step);
        const nextPos = (c === chords.length - 1) ? lyric.length : Math.min(lyric.length, (c + 1) * step);
        merged += `[${chords[c]}]${lyric.slice(pos, nextPos)}`;
      }
      out.push(merged);
      i++;
    } else {
      out.push(cur);
    }
  }
  return out.join("\n");
}

function parseRawSheet(raw, shift) {
  const normalized = normalizeSheetInput(raw);
  const lines = normalized.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  let currentSec = "主歌";
  const parsed = [];
  lines.forEach(line => {
    if (line.startsWith("#")) {
      currentSec = line.slice(1).trim();
      parsed.push({ type: "section", title: currentSec });
      return;
    }
    const regex = /\[([^\]]+)\]([^\[]*)|^([^\[]+)/g;
    const segs = [];
    let m;
    while ((m = regex.exec(line)) !== null) {
      if (m[1]) {
        segs.push({ chord: shiftChordName(m[1], shift), text: m[2] || " " });
      } else if (m[3]) {
        segs.push({ chord: "", text: m[3] });
      }
    }
    parsed.push({ type: "lyric", section: currentSec, segs, beats: 8 });
  });
  return parsed;
}

function getPreviewLyric(raw) {
  const lines = raw.split(/\r?\n/).map(s => s.trim()).filter(l => l && !l.startsWith("#"));
  for (const l of lines) {
    const clean = l.replace(/\[[^\]]+\]/g, "").replace(/[—\-\s]/g, "");
    if (clean.length >= 4 && !clean.startsWith("前奏")) {
      return l.replace(/\[[^\]]+\]/g, "");
    }
  }
  return (lines[0] || "").replace(/\[[^\]]+\]/g, "");
}

function triggerSearchFocus() {
  const inp = document.getElementById("searchInput");
  inp.focus();
  renderLibrary();
}

function clearSearch() {
  document.getElementById("searchInput").value = "";
  renderLibrary();
}

function addFromCatalog(catId, evt) {
  if (evt) evt.stopPropagation();
  const item = BUILTIN_CATALOG.find(x => x.id === catId);
  if (!item) return;
  const exists = songs.find(s => s.id === item.id);
  if (!exists) {
    songs.unshift(JSON.parse(JSON.stringify(item)));
    localStorage.setItem("custom_songbook_v2", JSON.stringify(songs));
    showToast(`✅ 已将《${item.title}》(${item.versionTag}) 加入我的曲库`);
  } else {
    showToast(`🎵《${item.title}》已在曲库中，正在打开...`);
    openSong(item.id);
    return;
  }
  renderLibrary();
}

function renderLibrary() {
  const q = (document.getElementById("searchInput").value || "").trim().toLowerCase();
  const catSec = document.getElementById("catalogResultsSection");
  const catList = document.getElementById("catalogList");

  // If user typed a search query, show searchable catalog items with 1-click "＋加入曲库"
  if (q.length > 0) {
    catSec.style.display = "block";
    catList.innerHTML = "";
    const matches = BUILTIN_CATALOG.filter(s =>
      s.title.toLowerCase().includes(q) ||
      s.artist.toLowerCase().includes(q) ||
      (s.versionTag && s.versionTag.toLowerCase().includes(q)) ||
      s.raw.toLowerCase().includes(q)
    );
    if (matches.length === 0) {
      catList.innerHTML = `<div class="song-card" onclick="openAddModalWithTitle('${q}')">
        <div class="song-card-left">
          <div class="song-title">未找到《${q}》现成谱</div>
          <div class="song-preview">点此直接粘贴有谱么/吉他谱文字，自动生成跟唱谱 ›</div>
        </div>
        <button class="add-lib-btn">＋ 贴谱添加</button>
      </div>`;
    } else {
      matches.forEach(item => {
        const inLib = songs.some(s => s.id === item.id);
        const card = document.createElement("div");
        card.className = "song-card";
        card.onclick = () => {
          if (!inLib) addFromCatalog(item.id);
          openSong(item.id);
        };
        card.innerHTML = `
          <div class="song-card-left">
            <div class="song-title">${item.title} <span class="song-artist">· ${item.artist}</span></div>
            <div class="song-badges">
              <span class="badge pink">${item.versionTag || (item.baseKey + '调')}</span>
              <span class="badge">♩=${item.bpm} BPM</span>
              <span class="badge">可弹 ${item.playable || '100%'}</span>
            </div>
            <div class="song-preview">${getPreviewLyric(item.raw)}</div>
          </div>
          <button class="add-lib-btn ${inLib ? 'added' : ''}" onclick="addFromCatalog('${item.id}', event)">
            ${inLib ? '✓ 已在曲库' : '＋ 加入曲库'}
          </button>
        `;
        catList.appendChild(card);
      });
    }
  } else {
    catSec.style.display = "none";
  }

  const list = document.getElementById("songList");
  list.innerHTML = "";
  const filtered = songs.filter(s => {
    if (currentFilter !== "all" && s.artist !== currentFilter) return false;
    if (q && !(s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q) || s.raw.toLowerCase().includes(q))) return false;
    return true;
  });
  document.getElementById("myLibCount").textContent = `共 ${filtered.length} 首`;

  filtered.forEach(s => {
    const cleanPreview = getPreviewLyric(s.raw);
    const div = document.createElement("div");
    div.className = "song-card";
    div.onclick = () => openSong(s.id);
    div.innerHTML = `
      <div class="song-card-left">
        <div class="song-title">${s.title} <span class="song-artist">· ${s.artist}</span></div>
        <div class="song-badges">
          <span class="badge pink">${s.versionTag || (s.baseKey + '调 · ' + s.capo)}</span>
          <span class="badge">♩=${s.bpm} BPM</span>
          <span class="badge">可弹 ${s.playable || '100%'}</span>
        </div>
        <div class="song-preview">${cleanPreview}</div>
      </div>
      <div style="color:var(--accent);font-weight:800;font-size:18px;padding-left:6px;">›</div>
    `;
    list.appendChild(div);
  });
}

function openAddModalWithTitle(t) {
  document.getElementById("newTitle").value = t;
  openAddModal();
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll("#filterPills .pill").forEach(el => {
    el.classList.toggle("active", el.textContent.includes(f === "all" ? "全部" : f));
  });
  renderLibrary();
}

function openSong(id) {
  stopPlay();
  currentSong = songs.find(s => s.id === id) || BUILTIN_CATALOG.find(s => s.id === id) || songs[0];
  semitoneShift = 0;
  currentLineIdx = 0;
  document.getElementById("libraryView").classList.remove("active");
  document.getElementById("sheetView").classList.add("active");
  renderSongSheet();
}

function backToLibrary() {
  stopPlay();
  document.getElementById("sheetView").classList.remove("active");
  document.getElementById("libraryView").classList.add("active");
  renderLibrary();
}

function renderSongSheet() {
  const s = currentSong;
  const activeKey = shiftChordName(s.baseKey, semitoneShift);
  document.getElementById("stTitle").textContent = s.title;
  document.getElementById("stArtist").textContent = `${s.artist} · 4/4拍`;
  document.getElementById("ctrlKey").innerHTML = `${activeKey}调 <span>›</span>`;
  document.getElementById("ctrlCapo").textContent = semitoneShift === 0 ? s.capo : `已移调 (${semitoneShift > 0 ? '+'+semitoneShift : semitoneShift})`;
  document.getElementById("ctrlBpm").innerHTML = `${s.bpm} <span>BPM</span>`;
  document.getElementById("ctrlPlayable").innerHTML = `${s.playable || '100%'} <span>›</span>`;

  const parsed = parseRawSheet(s.raw, semitoneShift);
  const container = document.getElementById("sheetContainer");
  const secTabs = document.getElementById("secTabs");
  const chordStrip = document.getElementById("songChordStrip");
  container.innerHTML = "";
  secTabs.innerHTML = "";
  chordStrip.innerHTML = "";

  const uniqueChords = new Set();
  const sectionsSeen = [];
  let lyricIdx = 0;

  parsed.forEach(item => {
    if (item.type === "section") {
      const h = document.createElement("div");
      h.className = "section-header";
      h.textContent = item.title;
      container.appendChild(h);
      if (!sectionsSeen.find(x => x.title === item.title)) {
        sectionsSeen.push({ title: item.title, lineIdx: lyricIdx });
      }
    } else {
      const idx = lyricIdx++;
      const row = document.createElement("div");
      row.className = "lyric-line" + (idx === currentLineIdx ? " active" : "");
      row.id = `line-${idx}`;
      row.dataset.section = item.section;
      row.onclick = () => jumpToLine(idx);

      const prog = document.createElement("div");
      prog.className = "line-progress";
      prog.id = `prog-${idx}`;
      row.appendChild(prog);

      const segRow = document.createElement("div");
      segRow.className = "segments-row";
      let chordCountInLine = 0;
      item.segs.forEach((sg) => {
        if (sg.chord) {
          uniqueChords.add(sg.chord);
          chordCountInLine++;
        }
        const segEl = document.createElement("div");
        segEl.className = "seg";
        const chEl = document.createElement("div");
        chEl.className = "ch";
        if (sg.chord) {
          chEl.dataset.chordIdx = String(chordCountInLine - 1);
          chEl.textContent = sg.chord;
          chEl.onclick = (e) => { e.stopPropagation(); strumChord(sg.chord); };
        }
        const txEl = document.createElement("div");
        txEl.className = "tx";
        if (sg.chord && sg.text.trim().length > 0) {
          txEl.innerHTML = `<u>${sg.text[0]}</u>${sg.text.slice(1)}`;
        } else {
          txEl.textContent = sg.text;
        }
        segEl.appendChild(chEl);
        segEl.appendChild(txEl);
        segRow.appendChild(segEl);
      });
      row.dataset.chordCount = String(Math.max(1, chordCountInLine));
      row.appendChild(segRow);
      container.appendChild(row);
    }
  });

  uniqueChords.forEach(c => {
    const chip = document.createElement("span");
    chip.className = "chord-chip";
    chip.textContent = `🔊 ${c}`;
    chip.onclick = () => strumChord(c);
    chordStrip.appendChild(chip);
  });

  sectionsSeen.forEach((sec, i) => {
    const tab = document.createElement("div");
    tab.className = "sec-tab" + (i === 0 ? " active" : "");
    tab.dataset.secTitle = sec.title;
    tab.textContent = sec.title;
    tab.onclick = () => jumpToLine(sec.lineIdx);
    secTabs.appendChild(tab);
  });

  updateActiveLineUI();
}

function jumpToLine(idx) {
  currentLineIdx = idx;
  lineBeatProgress = 0;
  beatInBar = 0;
  updateActiveLineUI();
}

function updateActiveLineUI() {
  const lines = document.querySelectorAll(".lyric-line");
  lines.forEach((el, i) => {
    const active = i === currentLineIdx;
    el.classList.toggle("active", active);
    const prog = document.getElementById(`prog-${i}`);
    if (prog) prog.style.width = active ? `${(lineBeatProgress / 8) * 100}%` : "0%";
  });
  const activeEl = document.getElementById(`line-${currentLineIdx}`);
  if (activeEl) {
    if (isPlaying) {
      activeEl.scrollIntoView({ behavior: "smooth", block: "center" });
    }
    // Sync bottom section tab highlight with current active line's section!
    const curSec = activeEl.dataset.section;
    document.querySelectorAll("#secTabs .sec-tab").forEach(tab => {
      tab.classList.toggle("active", tab.dataset.secTitle === curSec);
    });
    // Pulse the active chord in the current line proportional to how many chords the line has
    document.querySelectorAll(".ch.pulse").forEach(el => el.classList.remove("pulse"));
    if (isPlaying) {
      const chordCount = parseInt(activeEl.dataset.chordCount || "4", 10);
      const beatsPerChord = 8 / chordCount;
      const activeChordIdx = Math.min(chordCount - 1, Math.floor(lineBeatProgress / beatsPerChord));
      const chEl = activeEl.querySelector(`.ch[data-chord-idx="${activeChordIdx}"]`);
      if (chEl) chEl.classList.add("pulse");
    }
  }
}

function togglePlay() {
  if (isPlaying) {
    stopPlay();
  } else {
    startPlay();
  }
}

function startPlay() {
  isPlaying = true;
  document.getElementById("playBtn").innerHTML = "⏸ 暂停跟唱";
  document.getElementById("beatStatus").textContent = "随拍跟唱中";
  if (navigator.wakeLock) {
    navigator.wakeLock.request("screen").catch(()=>{});
  }
  const stepMs = (60 / currentSong.bpm) * 1000 / 4;
  let subTick = 0;
  updateActiveLineUI();
  timerId = setInterval(() => {
    if (subTick % 4 === 0) {
      for (let i = 0; i < 4; i++) {
        document.getElementById(`bdot${i}`).classList.toggle("on", i === beatInBar);
      }
      const bear = document.getElementById("bearMascot");
      bear.classList.toggle("nod", beatInBar === 0 || beatInBar === 2);
      document.getElementById("barCounter").textContent = `第 ${barCount} 小节 · ${beatInBar+1}/4拍`;
      playClick(beatInBar === 0);
      beatInBar = (beatInBar + 1) % 4;
      if (beatInBar === 0) barCount++;
    }
    subTick++;
    lineBeatProgress += 0.25;
    const totalLines = document.querySelectorAll(".lyric-line").length;
    if (lineBeatProgress >= 8) {
      lineBeatProgress = 0;
      const curSec = document.getElementById(`line-${currentLineIdx}`)?.dataset.section;
      if (currentLineIdx + 1 < totalLines) {
        const nextSec = document.getElementById(`line-${currentLineIdx+1}`)?.dataset.section;
        if (loopSection && nextSec !== curSec) {
          let first = 0;
          for (let k = 0; k < totalLines; k++) {
            if (document.getElementById(`line-${k}`)?.dataset.section === curSec) { first = k; break; }
          }
          currentLineIdx = first;
        } else {
          currentLineIdx++;
        }
      } else {
        currentLineIdx = 0;
        if (!loopSection) { stopPlay(); return; }
      }
    }
    updateActiveLineUI();
  }, stepMs);
}

function stopPlay() {
  isPlaying = false;
  if (timerId) { clearInterval(timerId); timerId = null; }
  const btn = document.getElementById("playBtn");
  if (btn) btn.innerHTML = "▶ 开始随拍跟唱";
  const st = document.getElementById("beatStatus");
  if (st) st.textContent = "点句子可跳拍";
}

function transposeKey() {
  if (currentSong.title === "程艾影") {
    semitoneShift = (semitoneShift === 0) ? 5 : 0;
  } else {
    semitoneShift = (semitoneShift + 1) % 12;
  }
  renderSongSheet();
}

function changeBpm(delta) {
  currentSong.bpm = Math.max(45, Math.min(150, currentSong.bpm + delta));
  document.getElementById("ctrlBpm").innerHTML = `${currentSong.bpm} <span>BPM</span>`;
  if (isPlaying) { stopPlay(); startPlay(); }
}

function strumCurrentFirstChord() {
  strumChord(shiftChordName(currentSong.baseKey, semitoneShift));
}

function toggleMetro() {
  metroOn = !metroOn;
  document.getElementById("metroBtn").classList.toggle("on", metroOn);
}

function toggleLoop() {
  loopSection = !loopSection;
  document.getElementById("loopBtn").classList.toggle("on", loopSection);
}

function toggleTheme() {
  const isDark = document.body.getAttribute("data-theme") === "dark";
  if (isDark) {
    document.body.removeAttribute("data-theme");
    document.getElementById("themeBtn").textContent = "🌙 夜间";
  } else {
    document.body.setAttribute("data-theme", "dark");
    document.getElementById("themeBtn").textContent = "☀️ 奶油";
  }
}

function cycleFont() {
  fontIdx = (fontIdx + 1) % FONT_SCALES.length;
  document.documentElement.style.setProperty("--font-scale", FONT_SCALES[fontIdx]);
  const labels = ["标准", "大字", "超大"];
  document.getElementById("fontBtn").textContent = labels[fontIdx];
}

function openAddModal() {
  document.getElementById("addModal").classList.add("open");
}

function openChordModal() {
  const grid = document.getElementById("chordGrid");
  grid.innerHTML = "";
  Object.keys(CHORD_FINGERS).forEach(ch => {
    const card = document.createElement("div");
    card.className = "chord-card";
    card.onclick = () => strumChord(ch);
    card.innerHTML = `
      <div style="font-size:18px;font-weight:800;color:var(--accent);">${ch} 和弦 🔊</div>
      <div style="font-size:12px;color:var(--text-sub);margin-top:4px;">${CHORD_FINGERS[ch]}</div>
    `;
    grid.appendChild(card);
  });
  document.getElementById("chordModal").classList.add("open");
}

function closeModals() {
  document.querySelectorAll(".modal-mask").forEach(el => el.classList.remove("open"));
}

function saveNewSong() {
  const title = document.getElementById("newTitle").value.trim() || "未命名歌曲";
  const artist = document.getElementById("newArtist").value.trim() || "精选";
  const baseKey = document.getElementById("newKey").value.trim() || "G";
  const capo = document.getElementById("newCapo").value.trim() || "不夹";
  const bpm = parseInt(document.getElementById("newBpm").value, 10) || 70;
  const rawInput = document.getElementById("newSheet").value.trim() || "#主歌\n[G]示例歌词[D]示例歌词";
  const normalizedRaw = normalizeSheetInput(rawInput);
  const newSong = {
    id: "song-" + Date.now(),
    title, artist, baseKey, capo,
    versionTag: `${baseKey}调 · ${capo}`,
    bpm, playable: "100%", raw: normalizedRaw
  };
  songs.unshift(newSong);
  localStorage.setItem("custom_songbook_v2", JSON.stringify(songs));
  closeModals();
  showToast(`✅ 已将《${title}》保存进我的曲库`);
  renderLibrary();
}

renderLibrary();
</script>
</body>
</html>
